# SkyGuard AI — Synthetic Anomaly Injection & Evaluation Configuration
# Defines parameterized fault generation rules, bounds, probabilities, and stream simulator settings.

random_seed: 42

# Default target parameters for anomaly injection
default_target_parameters:
  - "temperature"
  - "humidity"
  - "pressure"

# Parameterized configuration for all 15 anomaly categories
anomaly_types:
  spike:
    description: "High-magnitude impulse deviating sharply from local rolling window"
    magnitude_range:
      temperature: [5.0, 20.0]     # °C
      humidity: [20.0, 50.0]       # %
      pressure: [10.0, 35.0]       # hPa
    burst_length_steps: [1, 3]
    direction: "positive"

  small_spike:
    description: "Low-amplitude subtle impulse (1.0 to 2.5 sigma) testing residual filter sensitivity"
    magnitude_range:
      temperature: [0.5, 2.0]      # °C subtle deviation
      humidity: [3.0, 8.0]         # % subtle deviation
      pressure: [1.0, 3.0]         # hPa subtle deviation
    burst_length_steps: [1, 2]
    direction: "positive"

  negative_spike:
    description: "High-magnitude negative impulse"
    magnitude_range:
      temperature: [-20.0, -5.0]   # °C
      humidity: [-50.0, -20.0]     # %
      pressure: [-35.0, -10.0]     # hPa
    burst_length_steps: [1, 3]
    direction: "negative"

  drift:
    description: "Progressive linear or monotonic slope added across consecutive observations"
    slope_per_hour:
      temperature: [0.1, 1.0]      # °C per hour
      humidity: [0.5, 3.0]         # % per hour
      pressure: [0.2, 1.5]         # hPa per hour
    duration_hours: [3, 48]
    direction: "both"

  offset:
    description: "Sudden persistent step-function level shift in baseline"
    offset_magnitude:
      temperature: [2.0, 8.0]      # °C step shift
      humidity: [10.0, 30.0]       # % step shift
      pressure: [4.0, 15.0]        # hPa step shift
    duration_steps: [10, 100]

  frozen_sensor:
    description: "Constant invariant reading held over active diurnal cycle"
    duration_steps: [6, 48]       # Number of consecutive steps held invariant

  intermittent_freeze:
    description: "Alternating sequence of valid dynamic readings and frozen constant slices"
    freeze_slice_steps: [3, 8]
    valid_slice_steps: [2, 6]
    cycle_repetitions: [2, 5]

  missing_data:
    description: "Drop/deletion of observation records (single or consecutive)"
    drop_mode: "burst"            # 'single' | 'burst' | 'random'
    burst_size: [3, 24]
    random_drop_rate: 0.05

  communication_gap:
    description: "Sustained communication telemetry outage dropping all sensor parameters"
    gap_duration_hours: [2, 24]

  duplicate_data:
    description: "Duplicate telemetry packets with identical or near-identical timestamps"
    duplicate_count: [1, 3]
    jitter_seconds: 0             # 0 for exact duplicate timestamp

  out_of_order_data:
    description: "Reordered packets arriving after a delayed network delivery"
    shuffle_window_size: [3, 10]

  random_noise:
    description: "High-frequency Gaussian noise degrading sensor SNR"
    noise_std:
      temperature: 1.5             # °C std
      humidity: 5.0                # % std
      pressure: 2.5                # hPa std
    duration_steps: [12, 60]

  multivariate_inconsistency:
    description: "Uncorrelated or physically diverging joint sensor telemetry"
    pattern: "temp_rise_humidity_static"  # Rapid temp rise with static or rising humidity
    temp_delta_c: [5.0, 12.0]
    humidity_delta_pct: [0.0, 0.0]
    duration_steps: [4, 12]

  multi_sensor_fault:
    description: "Simultaneous independent faults across two or more physical sensors"
    primary_fault: "drift"
    primary_parameter: "temperature"
    secondary_fault: "frozen_sensor"
    secondary_parameter: "humidity"
    duration_steps: [12, 36]

  combined_fault:
    description: "Compound multi-stage failure (e.g. spike + packet drop + offset)"
    stages:
      - fault_type: "spike"
        parameter: "temperature"
      - fault_type: "missing_data"
        burst_size: 5
      - fault_type: "offset"
        parameter: "temperature"

# Evaluation Scenarios (Non-fault reference baselines)
evaluation_scenarios:
  possible_genuine_event:
    description: "Coherent multi-parameter severe weather event (e.g., squall front / thunderstorm)"
    temp_drop_c: [-8.0, -3.0]
    pressure_jump_hpa: [2.0, 6.0]
    humidity_rise_pct: [15.0, 35.0]
    duration_steps: [2, 6]
    ground_truth_label: "POSSIBLE_GENUINE_EVENT"
    is_fault: false

  uncertain:
    description: "Ambiguous borderline signal requiring probabilistic caution"
    temp_delta_c: [1.5, 3.0]
    ground_truth_label: "UNCERTAIN"
    is_fault: false

# 5-Minute Stream Simulator Configuration
stream_simulator:
  target_cadence_minutes: 5.0
  interpolation_method: "time_spline"  # 'time_spline' | 'linear'
  add_micro_turbulence: true
  micro_turbulence_scale:
    temperature: 0.05   # °C
    humidity: 0.2       # %
    pressure: 0.02      # hPa
